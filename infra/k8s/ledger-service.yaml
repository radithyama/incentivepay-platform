apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: incentivepay
spec:
  replicas: 1
  selector:
    matchLabels: { app: ledger-service }
  template:
    metadata:
      labels: { app: ledger-service }
    spec:
      containers:
        - name: ledger-service
          image: incentivepay/ledger-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: incentivepay-config }
          env:
            - { name: DB_URL, value: "jdbc:postgresql://postgres-ledger:5432/ledger_service" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: incentivepay-secrets, key: LEDGER_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: incentivepay-secrets, key: LEDGER_DB_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: incentivepay
spec:
  selector: { app: ledger-service }
  ports:
    - { port: 8082, targetPort: 8082 }
