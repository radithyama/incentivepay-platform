apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-incentive
  namespace: incentivepay
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-incentive }
  template:
    metadata:
      labels: { app: postgres-incentive }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: incentive_api }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: incentivepay-secrets, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: incentivepay-secrets, key: DB_PASSWORD } }
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-incentive
  namespace: incentivepay
spec:
  selector: { app: postgres-incentive }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ledger
  namespace: incentivepay
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-ledger }
  template:
    metadata:
      labels: { app: postgres-ledger }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: ledger_service }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: incentivepay-secrets, key: LEDGER_DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: incentivepay-secrets, key: LEDGER_DB_PASSWORD } }
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ledger
  namespace: incentivepay
spec:
  selector: { app: postgres-ledger }
  ports:
    - { port: 5432, targetPort: 5432 }
