# Placeholder Secret manifest for local kind/minikube demos ONLY.
# Values below are the same dev-only defaults as docker-compose.yml - do not
# reuse them anywhere real. In a live cluster these would come from a secret
# manager (e.g. Sealed Secrets, External Secrets Operator, Vault), never checked
# in plaintext like this.
apiVersion: v1
kind: Secret
metadata:
  name: incentivepay-secrets
  namespace: incentivepay
type: Opaque
stringData:
  DB_USER: incentive_api
  DB_PASSWORD: incentive_api
  LEDGER_DB_USER: ledger_service
  LEDGER_DB_PASSWORD: ledger_service
  HMAC_SECRET: dev-only-shared-secret-change-me
