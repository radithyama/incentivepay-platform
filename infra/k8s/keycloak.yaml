# Before applying: kubectl create configmap keycloak-realm -n incentivepay \
#   --from-file=realm-export.json=infra/keycloak/realm-export.json
# (kept as a separate `kubectl create configmap --from-file`, not duplicated inline here,
# so the realm definition has exactly one source of truth.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: incentivepay
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start-dev", "--import-realm"]
          env:
            - { name: KEYCLOAK_ADMIN, value: admin }
            - { name: KEYCLOAK_ADMIN_PASSWORD, value: admin }
            - { name: KC_HOSTNAME, value: localhost }
            - { name: KC_HOSTNAME_PORT, value: "8081" }
            - { name: KC_HOSTNAME_STRICT_BACKCHANNEL, value: "false" }
            - { name: KC_HTTP_ENABLED, value: "true" }
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-import
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: incentivepay
spec:
  selector: { app: keycloak }
  ports:
    - { port: 8080, targetPort: 8080 }
