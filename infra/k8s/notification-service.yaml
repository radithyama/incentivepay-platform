apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: incentivepay
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: incentivepay/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef: { name: incentivepay-config }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: incentivepay
spec:
  selector: { app: notification-service }
  ports:
    - { port: 8083, targetPort: 8083 }
