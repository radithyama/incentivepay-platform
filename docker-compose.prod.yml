# Production overlay: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build`
#
# Differences from the dev compose file:
#   - restart: unless-stopped on every service (survives crashes/reboots)
#   - Caddy in front on 80/443, automatic HTTPS (Let's Encrypt) per hostname
#     in deploy/Caddyfile - the only ports actually open to the internet
#   - Every app service's own port is rebound to 127.0.0.1 (reachable for
#     SSH-session debugging, not from the internet) - Caddy reaches them over
#     the internal Docker network by service name, not via published ports
#   - Postgres/Redpanda/notification-service ports bound to 127.0.0.1 only
#   - Real secrets via env vars (HMAC_SECRET, KEYCLOAK_ADMIN_PASSWORD) -
#     never hardcoded here or committed; see .env.prod.example
#   - KC_HOSTNAME / frontend build args point at the real HTTPS subdomains
#
# `ports:` entries below use the `!override` merge tag (Compose Spec 2.24+,
# needs a reasonably recent `docker compose`) deliberately: Compose's default
# merge behavior CONCATENATES list-type fields like `ports` across files
# rather than replacing them. Without `!override`, the dev file's
# "0.0.0.0:5432:5432" would still be applied alongside this file's
# "127.0.0.1:5432:5432" - i.e. Postgres would stay open to the internet even
# with this override in place. `!override` forces full replacement instead.

version: "3.8"

services:
  postgres-incentive:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:5432:5432"

  postgres-ledger:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:5433:5432"

  redpanda:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9092:9092"

  keycloak:
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_HOST}
      KC_PROXY: edge
    ports: !override
      - "127.0.0.1:8081:8080"

  incentive-api:
    restart: unless-stopped
    environment:
      HMAC_SECRET: ${HMAC_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    ports: !override
      - "127.0.0.1:8080:8080"

  ledger-service:
    restart: unless-stopped
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports: !override
      - "127.0.0.1:8082:8082"

  notification-service:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8083:8083"

  frontend:
    restart: unless-stopped
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_LEDGER_BASE_URL: ${VITE_LEDGER_BASE_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_HMAC_SECRET: ${HMAC_SECRET}
    ports: !override
      - "127.0.0.1:5173:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - incentive-api
      - ledger-service
      - keycloak

volumes:
  caddy-data:
  caddy-config:
